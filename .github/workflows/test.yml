name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # Point this secret at a DEDICATED, disposable Neon branch. The API suite
      # is destructive (the ops/db-admin tests wipe the sessions table), so it
      # must never target the dev or production branch. This env var takes
      # precedence over api/.env and api/.env.test (see api/vitest.setup.ts).
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the committed package-lock only carries the
      # dev machine's native binaries (npm/cli#4828), so `npm ci` on a Linux
      # runner won't install @rollup/* and @esbuild/* for this platform.
      # `npm install` fetches the runner's own platform binaries.
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace api
      - run: npm test --workspace api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace frontend
      - run: npm test --workspace frontend
