name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # A DEDICATED, disposable Neon branch — the API suite wipes the sessions
      # table, so never point this at dev/production. Overrides api/.env(.test).
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The committed package-lock was generated on win32-arm64 and only carries
      # that platform's native package entries (npm/cli#4828), so neither
      # `npm ci` nor `npm install` will fetch @rollup/* and @esbuild/* for Linux.
      # Regenerate the lockfile fresh on the runner — the fix npm itself
      # recommends — so the correct platform binaries get resolved.
      - run: rm -rf node_modules package-lock.json && npm install --no-audit --no-fund
      - run: npm run lint --workspace api
      - run: npm test --workspace api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rm -rf node_modules package-lock.json && npm install --no-audit --no-fund
      - run: npm run lint --workspace frontend
      - run: npm test --workspace frontend
